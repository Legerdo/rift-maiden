<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIFT MAIDEN · 리프트 메이든</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23140e24'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23ff3ca0'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%236ef4ff'/%3E%3Crect x='3' y='3' width='2' height='2' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07050d;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }
      #boot-msg {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a7fb8;
        font-family: sans-serif;
        font-size: 14px;
        letter-spacing: 2px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-msg">균열 좌표 계산 중…</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
